[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]
check-wasm = true
check-deploy = true

[canisters.backend]
main = "src/backend/main.mo"

[canisters.backend.check-stable]
path = ".old/src/backend/dist/backend.most"

[canisters.backend.migrations]
chain = "src/backend/migrations"
# 3 (not 2): the pending chain is three steps — 20260828_000000 (feeState),
# 20260910_200000 (MintRetryEntry.createdAtTime, F2) and 20260911_000000
# (minerFeeTxs, creation-fee single-use). Folding earlier steps into the
# latest would change their INPUT shapes and stop matching the state of any
# canister that already ran them — including the live draft — turning its
# next upgrade into a no-match/layout failure. The limit exists only to bound
# how much of the chain the checker validates; 3 validates all pending steps
# in order.
check-limit = 3

[toolchain]
moc = "1.11.2"
lintoko = "0.11.0"

[lint]
extends = true

[moc]
args = [ "-W=M0235,M0223,M0236,M0237,M0254", "-A=M0241", "--default-persistent-actors", "--implicit-package=core", "-no-check-ir", "--actor-idl=src/backend/system-idl" ]

[dependencies]
core = "2.6.1"
caffeineai-http-outcalls = "0.1.4"
icrc1-mo = "0.2.1"
array = "./src/backend/vendor/array"
caffeineai-oql = "0.4.0"
base = "0.16.0"
ic = "4.2.0"
